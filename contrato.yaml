
openapi: 3.0.3
info:
  title: TechPulse - Central Inteligente de Insights de Inovação
  description: >
    Contrato da API interna do TechPulse. Esta especificação define os
    recursos expostos pela aplicação para consulta e gerenciamento das
    informações consolidadas a partir das APIs externas (GNews e CoinGecko),
    processadas e persistidas no Airtable.
  version: "1.0.0"
  contact:
    name: Autor do Projeto
    email: seu-email@exemplo.com

servers:
  - url: https://api.techpulse.exemplo.com/v1
    description: Ambiente de produção (ou mock server durante o desenvolvimento)

# ---------------------------------------------------------------------------
# COMPONENTES REUTILIZÁVEIS
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token utilizado para proteger endpoints de escrita (POST/PATCH) e
        a tela de configuração. Endpoints de leitura pública podem
        dispensar autenticação, conforme decisão de projeto.

  schemas:
    Noticia:
      type: object
      properties:
        id:
          type: string
          description: ID interno do registro no Airtable
        idGNews:
          type: string
          description: ID único da notícia na GNews (evita duplicatas)
        titulo:
          type: string
        descricao:
          type: string
        url:
          type: string
          format: uri
        fonte:
          type: string
        imagem:
          type: string
          format: uri
        dataPublicacao:
          type: string
          format: date-time
        idioma:
          type: string
          enum: [pt, en, es]
        palavrasChave:
          type: array
          items:
            type: string
        jaProcessada:
          type: boolean
      required: [titulo, url, dataPublicacao, idGNews]

    PrecoAtivo:
      type: object
      properties:
        id:
          type: string
        ativo:
          type: string
          enum: [Bitcoin, Ethereum, Dogecoin, Solana, Outro]
        precoUsd:
          type: number
          format: float
        precoBrl:
          type: number
          format: float
        variacao24h:
          type: number
          format: float
          description: Percentual de variação nas últimas 24h
        volume24h:
          type: number
        marketCap:
          type: number
        timestamp:
          type: string
          format: date-time
        fonte:
          type: string
          example: CoinGecko
      required: [ativo, precoUsd, variacao24h, timestamp]

    Insight:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        textoCard:
          type: string
          description: Texto pronto para uso em stories/Instagram
        tipo:
          type: string
          enum: ["Notícia + Mercado", "Só Notícia", "Só Mercado"]
        prioridade:
          type: string
          enum: [Alta, Média, Baixa]
        status:
          type: string
          enum: [Novo, Usado, Arquivado]
        variacaoPercentual:
          type: number
          format: float
        ativoRelacionadoId:
          type: string
        noticiaRelacionadaId:
          type: string
        urlNoticia:
          type: string
          format: uri
        dataGeracao:
          type: string
          format: date-time
      required: [titulo, textoCard, tipo, status]

    Configuracao:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        palavrasChaveAtivas:
          type: array
          items:
            type: string
        ativosMonitorados:
          type: array
          items:
            type: string
        thresholdVariacao:
          type: number
          description: Percentual mínimo de variação para disparar automação
        frequenciaAtualizacao:
          type: string
          enum: ["1h", "2h", "3h", "6h"]
        idiomasPreferidos:
          type: array
          items:
            type: string
        ativo:
          type: boolean
      required: [nome, palavrasChaveAtivas, ativosMonitorados, thresholdVariacao]

    Erro:
      type: object
      properties:
        codigo:
          type: integer
        mensagem:
          type: string

  responses:
    NaoAutorizado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Proibido:
      description: Usuário sem permissão para acessar este recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

# ---------------------------------------------------------------------------
# RECURSOS / ENDPOINTS DA API INTERNA
# ---------------------------------------------------------------------------
paths:

  /noticias:
    get:
      summary: Listar notícias capturadas
      tags: [Noticias]
      parameters:
        - name: palavraChave
          in: query
          schema:
            type: string
          description: Filtra por palavra-chave (ex. "Elon Musk")
        - name: jaProcessada
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Lista de notícias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Noticia'
        "401":
          $ref: '#/components/responses/NaoAutorizado'

  /noticias/{id}:
    get:
      summary: Consultar notícia por ID
      tags: [Noticias]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notícia encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Noticia'
        "404":
          $ref: '#/components/responses/NaoEncontrado'

  /precos-ativos:
    get:
      summary: Listar cotações registradas
      tags: [PrecosAtivos]
      parameters:
        - name: ativo
          in: query
          schema:
            type: string
          description: Filtra por ativo (ex. Bitcoin)
        - name: desde
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lista de cotações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrecoAtivo'

  /precos-ativos/ultimos:
    get:
      summary: Obter a cotação mais recente de cada ativo monitorado
      tags: [PrecosAtivos]
      responses:
        "200":
          description: Últimas cotações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrecoAtivo'

  /insights:
    get:
      summary: Listar insights gerados
      tags: [Insights]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Novo, Usado, Arquivado]
        - name: prioridade
          in: query
          schema:
            type: string
            enum: [Alta, Média, Baixa]
      responses:
        "200":
          description: Lista de insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'
    post:
      summary: Criar um novo insight (uso interno da automação)
      tags: [Insights]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Insight'
      responses:
        "201":
          description: Insight criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        "401":
          $ref: '#/components/responses/NaoAutorizado'

  /insights/{id}:
    patch:
      summary: Atualizar status de um insight (ex. marcar como "Usado")
      tags: [Insights]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Novo, Usado, Arquivado]
      responses:
        "200":
          description: Insight atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          $ref: '#/components/responses/Proibido'
        "404":
          $ref: '#/components/responses/NaoEncontrado'

  /configuracoes:
    get:
      summary: Consultar configuração ativa da automação
      tags: [Configuracoes]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Configuração atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
    patch:
      summary: Atualizar palavras-chave, ativos monitorados ou threshold
      tags: [Configuracoes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Configuracao'
      responses:
        "200":
          description: Configuração atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracao'
        "401":
          $ref: '#/components/responses/NaoAutorizado'
        "403":
          $ref: '#/components/responses/Proibido'

# ---------------------------------------------------------------------------
# ANEXO: CONTRATO DAS APIs EXTERNAS CONSUMIDAS (referência, não implementadas
# por você - documentadas aqui para rastreabilidade e para a Parte Teórica)
# ---------------------------------------------------------------------------
# GNews API
#   GET https://gnews.io/api/v4/search
#     query params: q, lang, max, apikey
#     auth: API Key (query param)
#     retorna: { totalArticles, articles: [{ title, description, content,
#                url, image, publishedAt, source: { name, url } }] }
#
#   GET https://gnews.io/api/v4/top-headlines
#     query params: category, lang, apikey
#     auth: API Key (query param)
#
# CoinGecko API
#   GET https://api.coingecko.com/api/v3/simple/price
#     query params: ids, vs_currencies, include_24hr_change
#     auth: nenhuma (keyless) ou Demo Key no header x-cg-demo-api-key
#     retorna: { bitcoin: { usd, brl, usd_24h_change }, ... }
#
#   GET https://api.coingecko.com/api/v3/search/trending
#     auth: nenhuma
# ---------------------------------------------------------------------------