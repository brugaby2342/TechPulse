openapi: 3.0.3
info:
  title: TechPulse - Central Inteligente de Insights de Inovação
  description: >
    Contrato da API interna do TechPulse. Esta especificação define os
    recursos expostos pela aplicação para consulta e gerenciamento das
    informações consolidadas a partir das APIs externas (GNews e CoinGecko),
    processadas e persistidas no Airtable. O contrato adota a metodologia
    API First: a interface é definida e validada antes da implementação.
  version: "1.2.0"
  contact:
    name: Bruna Gabriela Ribeiro Sartor
    email: gabrielarsartor@icloud.com

servers:
  - url: http://localhost:8080/v1
    description: Ambiente de desenvolvimento (mock server)
  - url: https://api.techpulse.exemplo.com/v1
    description: Ambiente de produção

security:
  - BearerAuth: []

tags:
  - name: Noticias
    description: Notícias capturadas da GNews
  - name: PrecosAtivos
    description: Cotações de criptoativos capturadas da CoinGecko
  - name: Insights
    description: Cards de insight gerados pela automação
  - name: Configuracoes
    description: Parâmetros que controlam a automação (palavras-chave, threshold, ativos monitorados)

# ---------------------------------------------------------------------------
# PERFIS DE ACESSO
# ---------------------------------------------------------------------------
# O contrato define dois perfis. Apenas o Administrador efetivamente carrega
# um JWT com scopes: o perfil "Usuário comum" corresponde a requisições sem
# autenticação, pois os endpoints de leitura de Noticias, PrecosAtivos e
# Insights são públicos por decisão de projeto (dados não pessoais, de acordo com a LGPD).
#
# | Perfil             | Scopes concedidos no JWT                              |
# |--------------------|-------------------------------------------------------|
# | Administrador      | insights.write, insights.delete,                      |
# |                    | configuracoes.read, configuracoes.write               |
# | Usuário comum      | nenhum — acessa apenas os GETs públicos, sem token    |
#
# Regra de aplicação: a API verifica se o JWT apresentado contém o scope declarado em 
# x-required-scope no endpoint. Como o scope configuracoes.read só é emitido para 
# tokens do perfil Administrador, uma chamada de um usuário comum a GET /configuracoes:
#   - sem token  -> 401 Não Autenticado
#   - com token válido, mas sem o scope -> 403 Sem permissão. Acesso Negado
# ---------------------------------------------------------------------------

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT enviado em Authorization: Bearer {token}. Utilizado apenas
        pelo perfil Administrador.

  parameters:
    InsightId:
      name: id
      in: path
      required: true
      description: Identificador único do insight (recordId do Airtable)
      schema:
        type: string
      example: "recInsight001"

  schemas:
    # --------------------------- Notícias ---------------------------------
  
    Noticia:
      type: object
      additionalProperties: false
      required: [id, titulo, url, dataPublicacao, jaProcessada]
      properties:
        id:
          type: string
          description: ID interno gerado automaticamente pelo Airtable (útil para a automação no Make.com)
          readOnly: true
          example: "recNoticia001"
        titulo:
          type: string
        descricao:
          type: string
        url:
          type: string
          format: uri
          description: >
            Identificador natural do artigo, usado como chave de
            deduplicação — a GNews não fornece um ID nativo por artigo,
            mas a URL é estável e única por publicação.
        fonte:
          type: string
        imagem:
          type: string
          format: uri
        dataPublicacao:
          type: string
          format: date-time
        idioma:
          type: string
          enum: [pt, en, es]
        palavrasChave:
          type: array
          items:
            type: string
        jaProcessada:
          type: boolean
        dataCaptura:
          type: string
          format: date-time
          readOnly: true      
      
      example:
        id: "recNoticia001"
        titulo: "X anuncia nova política de transparência para pedidos governamentais"
        descricao: "Elon Musk afirma que a X passará a divulgar publicamente pedidos de remoção de conteúdo feitos por governos."
        url: "https://www.freepressjournal.in/tech/x-will-publicly-display-government-content-takedown-requests"
        fonte: "Free Press Journal"
        imagem: "https://media.assettype.com/freepressjournal/2026-08-17/byapxzyk/Untitled-design.jpg"
        dataPublicacao: "2026-08-17T06:58:09Z"
        idioma: "en"
        palavrasChave: ["Elon Musk", "X", "transparência"]
        jaProcessada: false
        dataCaptura: "2026-08-18T10:00:00Z"

    RespostaListaNoticias:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Notícias consultadas com sucesso."
        data:
          type: array
          items:
            $ref: '#/components/schemas/Noticia'

    # ------------------------ Preços de Ativos ------------------------------
    PrecoAtivo:
      type: object
      additionalProperties: false
      required: [id, ativo, precoUsd, variacao24h, timestamp]
      properties:
        id:
          type: string
          readOnly: true
        ativo:
          type: string
          enum: [bitcoin, ethereum, dogecoin, solana, nxm]
        precoUsd:
          type: number
          format: float
        precoBrl:
          type: number
          format: float
        variacao24h:
          type: number
          format: float
          description: Percentual de variação nas últimas 24h
        volume24h:
          type: number
          description: >
            Volume negociado em 24h (usd_24h_vol). Requer include_24hr_vol=true
            na chamada à CoinGecko; opcional pois a fonte pode omitir o dado
            para ativos de baixa liquidez.
        marketCap:
          type: number
          description: >
            Capitalização de mercado (usd_market_cap). Requer
            include_market_cap=true na chamada à CoinGecko; opcional pelo
            mesmo motivo de volume24h.
        timestamp:
          type: string
          format: date-time
          description: >
            Horário em que a automação executou a captura. A CoinGecko só
            retorna horário próprio (last_updated_at) se solicitado via
            include_last_updated_at=true; por padrão, este campo usa o
            horário de execução da automação.
        fonte:
          type: string
          example: CoinGecko
        
      example:
        id: "recPreco001"
        ativo: "bitcoin"
        precoUsd: 62345.12
        precoBrl: 336450.30
        variacao24h: 2.34
        volume24h: 28345678901.45
        marketCap: 1234567890123.00
        timestamp: "2026-08-18T10:00:00Z"

    RespostaListaPrecosAtivosUltimos:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Últimas cotações consultadas com sucesso."
        data:
          type: array
          items:
            $ref: '#/components/schemas/PrecoAtivo'

    RespostaListaPrecosAtivos:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Cotações consultadas com sucesso."
        data:
          type: array
          items:
            $ref: '#/components/schemas/PrecoAtivo'

    # ----------------------------- Insights ---------------------------------
    
    InsightInput:
      type: object
      additionalProperties: false
      description: Corpo utilizado por POST /insights (uso interno da automação).
      properties:
        titulo:
          type: string
        textoCard:
          type: string
          description: Texto pronto para uso em stories/Instagram
        tipo:
          type: string
          enum: ["Notícia + Mercado", "Só Notícia", "Só Mercado"]
        prioridade:
          type: string
          enum: [Alta, Média, Baixa]
        status:
          type: string
          enum: [Novo, Usado, Arquivado]
          default: Novo
        variacaoPercentual:
          type: number
          format: float
        ativoRelacionadoId:
          type: string
        noticiaRelacionadaId:
          type: string
        urlNoticia:
          type: string
          format: uri
      required: [titulo, textoCard, tipo, status]
      
    InsightStatusInput:
      type: object
      additionalProperties: false
      description: Corpo utilizado por PATCH /insights/{id} para atualizar apenas o status.
      properties:
        status:
          type: string
          enum: [Novo, Usado, Arquivado]
      required: [status]
      
    Insight:
      type: object
      additionalProperties: false
      required: [id, titulo, textoCard, tipo, status, dataGeracao]
      properties:
        id:
          type: string
          readOnly: true
        titulo:
          type: string
        textoCard:
          type: string
        tipo:
          type: string
          enum: ["Notícia + Mercado", "Só Notícia", "Só Mercado"]
        prioridade:
          type: string
          enum: [Alta, Média, Baixa]
        status:
          type: string
          enum: [Novo, Usado, Arquivado]
        variacaoPercentual:
          type: number
          format: float
        ativoRelacionadoId:
          type: string
        noticiaRelacionadaId:
          type: string
        urlNoticia:
          type: string
          format: uri
        dataGeracao:
          type: string
          format: date-time
          readOnly: true
        
      example:
        id: "recInsight001"
        titulo: "Bitcoin sobe após notícia sobre adoção institucional"
        textoCard: "Uma notícia recente sobre adoção institucional coincide com alta de 2.34% no Bitcoin nas últimas 24h, reforçando a correlação entre cobertura de mídia e movimento de preço."
        tipo: "Notícia + Mercado"
        prioridade: "Alta"
        status: "Novo"
        variacaoPercentual: 2.34
        ativoRelacionadoId: "bitcoin"
        noticiaRelacionadaId: "recNoticia001"
        urlNoticia: "https://www.freepressjournal.in/tech/x-will-publicly-display-government-content-takedown-requests"
        dataGeracao: "2026-08-18T10:05:00Z"
 
    RespostaInsight:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Insight criado com sucesso."
        data:
          $ref: '#/components/schemas/Insight'

    RespostaInsightAtualizado:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Insight atualizado com sucesso."
        data:
          $ref: '#/components/schemas/Insight'

    RespostaInsightArquivado:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Insight arquivado com sucesso."
        data:
          $ref: '#/components/schemas/Insight'

    RespostaListaInsights:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Insights consultados com sucesso."
        data:
          type: array
          items:
            $ref: '#/components/schemas/Insight'

    # --------------------------- Configurações -------------------------------
    
    ConfiguracaoInput:
      type: object
      additionalProperties: false
      description: Corpo utilizado por PATCH /configuracoes.
      properties:
        nome:
          type: string
        palavrasChaveAtivas:
          type: array
          items:
            type: string
        ativosMonitorados:
          type: array
          items:
            type: string
        thresholdVariacao:
          type: number
          description: Percentual mínimo de variação para disparar automação
        frequenciaAtualizacao:
          type: string
          enum: ["1h", "2h", "3h", "6h"]
        idiomasPreferidos:
          type: array
          items:
            type: string
        ativo:
          type: boolean
    
    Configuracao:
      type: object
      additionalProperties: false
      required: [id, nome, palavrasChaveAtivas, ativosMonitorados, thresholdVariacao, ativo]
      properties:
        id:
          type: string
          readOnly: true
        nome:
          type: string
        palavrasChaveAtivas:
          type: array
          items:
            type: string
        ativosMonitorados:
          type: array
          items:
            type: string
        thresholdVariacao:
          type: number
          description: Percentual mínimo de variação para disparar automação
        frequenciaAtualizacao:
          type: string
          enum: ["1h", "2h", "3h", "6h"]
        idiomasPreferidos:
          type: array
          items:
            type: string
        ativo:
          type: boolean
        ultimaAtualizacao:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        
      example:
        id: "recConfig001"
        nome: "Configuração Padrão TechPulse"
        palavrasChaveAtivas: ["Elon Musk", "SpaceX", "xAI", "Tesla"]
        ativosMonitorados: ["bitcoin", "ethereum"]
        thresholdVariacao: 5.0
        ativo: true
        frequenciaAtualizacao: "2h"
        idiomasPreferidos: ["pt", "en"]
        ultimaAtualizacao: "2026-08-18T08:00:00Z"
    
    RespostaConfiguracao:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Configuração consultada com sucesso."
        data:
          $ref: '#/components/schemas/Configuracao'

    RespostaConfiguracaoAtualizada:
      type: object
      additionalProperties: false
      required: [success, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          example: "Configuração atualizada com sucesso."
        data:
          $ref: '#/components/schemas/Configuracao'

    # ----------------------------- Genérico ---------------------------------
   
    RespostaErro:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string

  
  responses:
    NaoAutenticado:
      description: Token JWT ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            success: false
            message: "Token de autenticação ausente ou inválido. Inclua um Bearer Token válido no cabeçalho Authorization."
 
    DadosInvalidos:
      description: Dados enviados em formato inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            success: false
            message: "Um ou mais campos enviados são inválidos. Verifique os dados e tente novamente."
    
    AcessoNegado:
      description: Usuário autenticado sem o scope necessário
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            success: false
            message: "Token válido, porém sem permissão (scope) para acessar este recurso."
 
    ErroInterno:
      description: Falha inesperada ao processar a requisição
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            success: false
            message: "Ocorreu um erro inesperado ao processar a requisição. Tente novamente mais tarde."
          
    InsightNaoEncontrado:
      description: Insight não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            success: false
            message: "Insight não encontrado. Verifique se o 'id' informado está correto."
 
    ConfiguracaoNaoEncontrada:
      description: Configuração não encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            success: false
            message: "Configuração não encontrada. Verifique se o 'id' informado está correto."

# ---------------------------------------------------------------------------
# RECURSOS / ENDPOINTS DA API INTERNA
# ---------------------------------------------------------------------------
paths:

  /noticias:
    get:
      tags: [Noticias]
      summary: Listar notícias capturadas
      description: Lista as notícias já capturadas da GNews e persistidas no Airtable. Endpoint público — não requer autenticação, pois não expõe dado
        pessoal (notícias são conteúdo público capturado da GNews). Os filtros são independentes entre si, aplica-se apenas um por vez.
      operationId: listarNoticias
      security: []
      parameters:
        - name: palavraChave
          in: query
          schema:
            type: string
          description: Filtra por palavra-chave (ex. "Elon Musk")
        - name: jaProcessada
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notícias consultadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaListaNoticias'
        "500":
          $ref: '#/components/responses/ErroInterno'

  /precos-ativos:
    get:
      tags: [PrecosAtivos]
      summary: Listar cotações registradas
      operationId: listarPrecosAtivos
      security: []
      parameters:
        - name: ativo
          in: query
          schema:
            type: string
          description: Filtra por ativo (ex. Bitcoin)
      responses:
        "200":
          description: Cotações consultadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaListaPrecosAtivos'
        "500":
          $ref: '#/components/responses/ErroInterno'

  /precos-ativos/ultimos:
    get:
      tags: [PrecosAtivos]
      summary: Obter a cotação mais recente de cada ativo monitorado
      operationId: obterUltimasCotacoes
      security: []
      responses:
        "200":
          description: Últimas cotações consultadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaListaPrecosAtivosUltimos'
        "500":
          $ref: '#/components/responses/ErroInterno'

  /insights:
    get:
      tags: [Insights]
      summary: Listar insights gerados
      description: Os filtros são independentes entre si, aplica-se apenas um por vez.
      operationId: listarInsights
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Novo, Usado, Arquivado]
        - name: prioridade
          in: query
          schema:
            type: string
            enum: [Alta, Média, Baixa]
        - name: titulo
          in: query
          schema:
            type: string
          description: Busca parcial (contém) pelo título do insight
      responses:
        "200":
          description: Insights consultados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaListaInsights'
        "500":
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Insights]
      summary: Criar um novo insight (uso interno da automação)
      description: Restrito ao perfil Administrador.
      operationId: criarInsight
      security:
        - BearerAuth: []
      x-required-scope: insights.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightInput'
      responses:
        "201":
          description: Insight criado com sucesso
          headers:
            Location:
              description: URI do insight criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInsight'
        "400":
          $ref: '#/components/responses/DadosInvalidos'
        "401":
          $ref: '#/components/responses/NaoAutenticado'
        "403":
          $ref: '#/components/responses/AcessoNegado'
        "500":
          $ref: '#/components/responses/ErroInterno'

  /insights/{id}:
    parameters:
      - $ref: '#/components/parameters/InsightId'
    patch:
      tags: [Insights]
      summary: Atualizar status de um insight (ex. marcar como "Usado")
      description: Restrito ao perfil Administrador.
      operationId: atualizarStatusInsight
      security:
        - BearerAuth: []
      x-required-scope: insights.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightStatusInput'
      responses:
        "200":
          description: Insight atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInsightAtualizado'
        "400":
          $ref: '#/components/responses/DadosInvalidos'
        "401":
          $ref: '#/components/responses/NaoAutenticado'
        "403":
          $ref: '#/components/responses/AcessoNegado'
        "404":
          $ref: '#/components/responses/InsightNaoEncontrado'
        "500":
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Insights]
      summary: Remover (arquivar) insight
      description: >
        Executa uma remoção lógica (soft delete): altera o campo `status`
        do insight para "Arquivado" no Airtable, preservando o histórico
        do registro. A remoção física é reservada para a rotina de
        retenção de dados (insights com mais de 30 dias), executada pela
        automação, e não é exposta como operação direta da API. Por isso
        recebe um scope próprio (`insights.delete`), distinto de
        `insights.write` usado para simples atualização de status. Restrito
        ao perfil Administrador.
      operationId: removerInsight
      security:
        - BearerAuth: []
      x-required-scope: insights.delete
      responses:
        "200":
          description: Insight arquivado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaInsightArquivado'
        "401":
          $ref: '#/components/responses/NaoAutenticado'
        "403":
          $ref: '#/components/responses/AcessoNegado'
        "404":
          $ref: '#/components/responses/InsightNaoEncontrado'
        "500":
          $ref: '#/components/responses/ErroInterno'

  /configuracoes:
    get:
      tags: [Configuracoes]
      summary: Consultar configuração ativa da automação
      description: >
        Restrito ao perfil Administrador — diferentemente dos demais
        recursos de leitura (notícias, preços e insights), a configuração
        da automação não é considerada dado público, pois expõe a lógica
        de negócio do sistema (palavras-chave, threshold, ativos monitorados).
      operationId: consultarConfiguracao
      security:
        - BearerAuth: []
      x-required-scope: configuracoes.read
      responses:
        "200":
          description: Configuração consultada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConfiguracao'
        "401":
          $ref: '#/components/responses/NaoAutenticado'
        "403":
          $ref: '#/components/responses/AcessoNegado'
        "404":
          $ref: '#/components/responses/ConfiguracaoNaoEncontrada'
        "500":
          $ref: '#/components/responses/ErroInterno'
    patch:
      tags: [Configuracoes]
      summary: Atualizar palavras-chave, ativos monitorados ou threshold
      description: Restrito ao perfil Administrador.
      operationId: atualizarConfiguracao
      security:
        - BearerAuth: []
      x-required-scope: configuracoes.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracaoInput'
      responses:
        "200":
          description: Configuração atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConfiguracaoAtualizada'
        "400":
          $ref: '#/components/responses/DadosInvalidos'
        "401":
          $ref: '#/components/responses/NaoAutenticado'
        "403":
          $ref: '#/components/responses/AcessoNegado'
        "404":
          $ref: '#/components/responses/ConfiguracaoNaoEncontrada'
        "500":
          $ref: '#/components/responses/ErroInterno'

